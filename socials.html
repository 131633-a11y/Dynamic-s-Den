<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dynamic's socials - find me on Discord, Minecraft and Roblox." />
  <title>My socials - Dynamic's Den</title>
  <style>
    :root {
      --bg: #080a13;
      --bg-soft: #101324;
      --panel: rgba(19, 23, 43, 0.84);
      --panel-strong: #171b33;
      --line: rgba(255, 255, 255, 0.09);
      --text: #f4f6ff;
      --muted: #9ba3c7;
      --cyan: #63f5dc;
      --purple: #9b7bff;
      --pink: #ff65b3;
      --yellow: #ffd86b;
      --green: #82ef9a;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
      --radius: 24px;
      --radius-sm: 16px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      background: radial-gradient(circle at top, var(--bg-soft), var(--bg));
      color: var(--text);
      font-family: var(--font);
    }

    .tabs {
      display: flex;
      gap: 6px;
      padding: 6px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: var(--shadow);
    }

    .tabs a {
      padding: 10px 18px;
      border-radius: 999px;
      color: var(--muted);
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s, background 0.2s;
    }

    .tabs a:hover { color: var(--text); }

    .tabs a[aria-current="page"] {
      color: var(--bg);
      background: linear-gradient(90deg, var(--cyan), var(--purple));
    }

    .card {
      width: 100%;
      max-width: 640px;
      padding: 40px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3rem);
      background: linear-gradient(90deg, var(--cyan), var(--purple), var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p { color: var(--muted); line-height: 1.6; }

    /* Hover animations */
    .tabs a { transition: color 0.2s, background 0.2s, transform 0.2s ease; }
    .tabs a:hover { transform: translateY(-2px); }

    .card { transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease; }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(155, 123, 255, 0.35);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4), 0 0 40px rgba(155, 123, 255, 0.15);
    }

    h1 { background-size: 200% auto; transition: background-position 0.6s ease; }
    .card:hover h1 { background-position: 100% center; }

    /* Liquid Glass */
    body { overflow-x: hidden; }

    .orbs {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .orbs span {
      position: absolute;
      width: 42vmax;
      height: 42vmax;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.45;
      animation: drift 22s ease-in-out infinite alternate;
    }

    .orbs span:nth-child(1) { top: -12vmax; left: -10vmax; background: var(--cyan); }
    .orbs span:nth-child(2) { bottom: -16vmax; right: -12vmax; background: var(--purple); animation-duration: 26s; animation-delay: -6s; }
    .orbs span:nth-child(3) { top: 30%; left: 55%; width: 26vmax; height: 26vmax; background: var(--pink); opacity: 0.3; animation-duration: 30s; animation-delay: -12s; }

    @keyframes drift {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(8vmax, 6vmax) scale(1.12); }
      100% { transform: translate(-6vmax, 10vmax) scale(0.92); }
    }

    .glass {
      position: relative;
      isolation: isolate;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03) 60%, rgba(255, 255, 255, 0.06));
      border: 1px solid rgba(255, 255, 255, 0.16);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      backdrop-filter: blur(22px) saturate(180%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),
        inset 0 -1px 0 rgba(255, 255, 255, 0.06),
        inset 0 0 24px rgba(255, 255, 255, 0.05),
        var(--shadow);
    }

    /* Specular sheen that follows the cursor */
    .glass::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background: radial-gradient(420px circle at var(--mx, 20%) var(--my, 0%), rgba(255, 255, 255, 0.16), transparent 45%);
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    /* Neon rim light around the edge */
    .glass::after {
      content: "";
      position: absolute;
      inset: -1px;
      z-index: -1;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(99, 245, 220, 0.55), transparent 35%, transparent 65%, rgba(255, 101, 179, 0.5));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
      opacity: 0.6;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    .glass:hover::after { opacity: 1; }

    .card.glass:hover {
      border-color: rgba(255, 255, 255, 0.24);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.45),
        inset 0 -1px 0 rgba(255, 255, 255, 0.08),
        inset 0 0 30px rgba(255, 255, 255, 0.07),
        0 30px 80px rgba(0, 0, 0, 0.4),
        0 0 50px rgba(155, 123, 255, 0.22);
    }

    .tabs a[aria-current="page"] {
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6), inset 0 -2px 6px rgba(0, 0, 0, 0.15), 0 0 18px rgba(99, 245, 220, 0.35);
    }

    .tabs a:not([aria-current="page"]):hover { background: rgba(255, 255, 255, 0.08); }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .glass { background: var(--panel); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }

    .socials {
      display: grid;
      gap: 14px;
      margin-top: 28px;
      text-align: left;
    }

    .social {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
    }

    .social .icon {
      flex: none;
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .social .icon svg { display: block; }

    .discord .icon { background: #5865f2; color: #fff; }
    .discord .icon svg { width: 28px; height: 28px; }
    .minecraft .icon { background: #6b4a2b; }
    .minecraft .icon svg { width: 48px; height: 48px; }
    .roblox .icon { background: #fff; color: #111; }
    .roblox .icon svg { width: 30px; height: 30px; }

    .social {
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .social:hover { transform: translateY(-3px) scale(1.01); }
    .discord:hover { border-color: #5865f2; box-shadow: 0 10px 30px rgba(88, 101, 242, 0.3); }
    .minecraft:hover { border-color: var(--green); box-shadow: 0 10px 30px rgba(130, 239, 154, 0.25); }
    .roblox:hover { border-color: #fff; box-shadow: 0 10px 30px rgba(255, 255, 255, 0.18); }

    .social:hover .icon { transform: rotate(-8deg) scale(1.12); }

    .social .info { flex: 1; min-width: 0; }

    .social .label {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .social .handle {
      margin: 2px 0 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .copy {
      flex: none;
      padding: 8px 14px;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--cyan);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s, transform 0.2s ease;
    }

    .copy:hover {
      border-color: var(--cyan);
      color: var(--bg);
      background: var(--cyan);
      transform: scale(1.06);
    }
    .copy:active { transform: scale(0.95); }
    .copy.copied, .copy.copied:hover { color: var(--green); border-color: var(--green); background: transparent; }
  </style>
</head>
<body>
  <div class="orbs" aria-hidden="true"><span></span><span></span><span></span></div>
  <nav class="tabs glass" aria-label="Main">
    <a href="/">Home</a>
    <a href="/socials" aria-current="page">My socials</a>
  </nav>
  <main class="card glass">
    <h1>My socials</h1>

    <ul class="socials" style="list-style: none; padding: 0;">

      </li>
    </ul>
  </main>
  <script>
    document.querySelectorAll(".glass").forEach((el) => {
      el.addEventListener("pointermove", (event) => {
        const rect = el.getBoundingClientRect();
        el.style.setProperty("--mx", `${event.clientX - rect.left}px`);
        el.style.setProperty("--my", `${event.clientY - rect.top}px`);
      });
    });
    document.querySelectorAll(".copy").forEach((button) => {
      button.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(button.dataset.copy);
          button.textContent = "Copied!";
          button.classList.add("copied");
          setTimeout(() => {
            button.textContent = "Copy";
            button.classList.remove("copied");
          }, 1500);
        } catch {
          button.textContent = "Copy failed";
        }
      });
    });
  </script>

</html>
